# SIGE - entorno completo en contenedores.
#   cp .env.example .env    (y cambie las claves)
#   docker compose up -d --build                 -> todo
#   docker compose --profile infra up -d         -> solo infraestructura (para desarrollar con quarkus dev / ng serve)
name: sige

x-service: &ms
  build:
    context: ../../backend
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
  environment: &ms-env
    PORT: "8080"
    DB_REACTIVE_URL: postgresql://postgres:5432/sige
    DB_JDBC_URL: jdbc:postgresql://postgres:5432/sige
    DB_PASSWORD: ${SIGE_DB_SERVICE_PASSWORD}
    KAFKA_BOOTSTRAP: kafka:9092
    OIDC_URL: http://keycloak:8080/realms/sige
    CORS_ORIGINS: http://localhost:8080
    OTEL_ENABLED: "false"
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8080/q/health/ready || exit 1"]
    interval: 15s
    timeout: 3s
    retries: 10
  profiles: ["app"]

services:
  # ------------------------------------------------------------------ infraestructura
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sige
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SIGE_DB_SERVICE_PASSWORD: ${SIGE_DB_SERVICE_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sige"]
      interval: 5s
      retries: 20
    profiles: ["infra", "app"]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports: ["127.0.0.1:29092:29092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    profiles: ["infra", "app"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: sige
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["127.0.0.1:8090:8080"]
    depends_on: [kafka]
    profiles: ["infra", "app"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      SIGE_ADMIN_PASSWORD: ${SIGE_ADMIN_PASSWORD}
      SIGE_FRONTEND_URL: ${SIGE_FRONTEND_URL:-http://localhost:8080}
      # emisor publico (via gateway) y canal interno dinamico para los microservicios
      KC_HOSTNAME: ${SIGE_FRONTEND_URL:-http://localhost:8080}
      KC_HOSTNAME_ADMIN: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    profiles: ["infra", "app"]

  # ------------------------------------------------------------------ API gateway
  gateway:
    image: traefik:v3.5
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
      - --metrics.prometheus=true
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"]
    profiles: ["app"]

  # ------------------------------------------------------------------ microservicios
  ms-seguridad:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-seguridad } }
    environment: { <<: *ms-env, DB_USER: sige_seguridad }
  ms-maestros:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-maestros } }
    environment: { <<: *ms-env, DB_USER: sige_maestros }
  ms-logistica:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-logistica } }
    environment: { <<: *ms-env, DB_USER: sige_logistica }
  ms-ventas:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-ventas } }
    environment: { <<: *ms-env, DB_USER: sige_ventas, MS_MAESTROS_URL: "http://ms-maestros:8080" }
  ms-contabilidad:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-contabilidad } }
    environment: { <<: *ms-env, DB_USER: sige_contabilidad }
  ms-finanzas:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-finanzas } }
    environment: { <<: *ms-env, DB_USER: sige_finanzas }
  ms-rrhh:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-rrhh } }
    environment: { <<: *ms-env, DB_USER: sige_rrhh }
  ms-produccion:
    <<: *ms
    build: { context: ../../backend, args: { SERVICE: ms-produccion } }
    environment: { <<: *ms-env, DB_USER: sige_produccion }

  # ------------------------------------------------------------------ frontend
  frontend:
    build: { context: ../../frontend }
    restart: unless-stopped
    profiles: ["app"]

volumes:
  pgdata:
  kafkadata:
