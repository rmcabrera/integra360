  - configmap.yaml
  - services/ms-seguridad.yaml
  - services/ms-maestros.yaml
  - services/ms-logistica.yaml
  - services/ms-ventas.yaml
  - services/ms-contabilidad.yaml
  - services/ms-finanzas.yaml
  - services/ms-rrhh.yaml
  - services/ms-produccion.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml
