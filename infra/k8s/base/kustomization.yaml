apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secret sige-db NO se incluye aqui a proposito: creelo con `kubectl create secret`
# o con External Secrets (ver secret-sige-db.example.yaml).
namespace: sige

labels:
  - pairs:
      app.kubernetes.io/part-of: sige
    includeSelectors: false

resources:
