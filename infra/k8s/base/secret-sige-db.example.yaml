# EJEMPLO / PLANTILLA. NO aplicar tal cual y NO poner secretos reales en git.
# Este archivo NO esta referenciado por kustomization.yaml a proposito.
#
# Cree el Secret fuera de git, p.ej.:
#   kubectl -n sige create secret generic sige-db \
#     --from-literal=DB_PASSWORD='<clave-del-rol-sige_*>'
#
# O gestionelo con External Secrets Operator (recomendado en la nube):
# ---
# apiVersion: external-secrets.io/v1
# kind: ExternalSecret
# metadata:
#   name: sige-db
#   namespace: sige
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: sige-cluster-store      # SecretStore/ClusterSecretStore (AWS SM, Vault, etc.)
#     kind: ClusterSecretStore
#   target:
#     name: sige-db
#     creationPolicy: Owner
#   data:
#     - secretKey: DB_PASSWORD
#       remoteRef:
#         key: sige/db
#         property: service_password
---
apiVersion: v1
kind: Secret
metadata:
  name: sige-db
  namespace: sige
  labels:
    app.kubernetes.io/part-of: sige
type: Opaque
stringData:
  # Clave compartida por los roles sige_<servicio> (ver postInitApplicationSQL
  # del Cluster CloudNativePG). SUSTITUYA este valor; no lo versione.
  DB_PASSWORD: "CHANGE-ME"
