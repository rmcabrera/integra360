# ms-contabilidad - Deployment + Service + HPA + PodDisruptionBudget
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-contabilidad
  labels:
    app.kubernetes.io/name: ms-contabilidad
    app.kubernetes.io/part-of: sige
    app.kubernetes.io/component: microservice
    sige.service: contabilidad
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-contabilidad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-contabilidad
        app.kubernetes.io/part-of: sige
        app.kubernetes.io/component: microservice
        sige.service: contabilidad
        sige.role: service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/OWNER/sige-ms-contabilidad:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sige-config
            - secretRef:
                name: sige-db
          env:
            - name: DB_USER
              value: sige_contabilidad
            - name: CONTA_VENTAS_DEFAULT
              value: "0001"
            - name: CONTA_VENTAS_FACTURA
              value: "0001"
            - name: CONTA_VENTAS_BOLETA
              value: "0003"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 185
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-contabilidad
  labels:
    app.kubernetes.io/name: ms-contabilidad
    app.kubernetes.io/part-of: sige
    sige.service: contabilidad
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ms-contabilidad
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-contabilidad
  labels:
    app.kubernetes.io/name: ms-contabilidad
    app.kubernetes.io/part-of: sige
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-contabilidad
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ms-contabilidad
  labels:
    app.kubernetes.io/name: ms-contabilidad
    app.kubernetes.io/part-of: sige
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-contabilidad
