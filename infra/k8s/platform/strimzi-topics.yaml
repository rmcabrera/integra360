# Topics Kafka (gestionados por el Topic Operator de Strimzi).
# partitions 6, replicas 3; retencion 7d salvo las DLQ (30d).
# dev: con 1 broker baje replicas a 1.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: sige.ventas.factura.v1
  namespace: sige
  labels:
    strimzi.io/cluster: sige-kafka
    app.kubernetes.io/part-of: sige
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
---
