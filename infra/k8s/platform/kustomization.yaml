apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Recursos de los operadores (CloudNativePG, Strimzi, Keycloak). Aplicar DESPUES
# de instalar los operadores y ANTES de los overlays de la aplicacion.
# Los CRDs de los operadores deben existir en el cluster al aplicar (no al
# renderizar con `kubectl kustomize`).
namespace: sige

resources:
  - cloudnativepg-cluster.yaml
  - strimzi-kafka.yaml
  - strimzi-topics.yaml
  - keycloak.yaml
