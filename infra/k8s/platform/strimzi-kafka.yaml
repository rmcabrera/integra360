# Kafka en modo KRaft gestionado por el operador Strimzi (KafkaNodePool).
# Operador: https://strimzi.io  (instalar antes, ver README).
#
# Expone el bootstrap interno en sige-kafka-kafka-bootstrap:9092 (coincide con
# KAFKA_BOOTSTRAP de sige-config).
#
# prod: 3 nodos (broker+controller). dev: baje replicas a 1 y los factores de
# replicacion / min.insync.replicas a 1.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: sige
  labels:
    strimzi.io/cluster: sige-kafka
    app.kubernetes.io/part-of: sige
spec:
  replicas: 3
  roles:
    - broker
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        # class: gp3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: sige-kafka
  namespace: sige
  labels:
    app.kubernetes.io/part-of: sige
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # prod con 3 nodos: tolera la caida de 1 nodo sin perder disponibilidad
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 2Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
