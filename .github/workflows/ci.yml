name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones antiguas de la misma rama/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Quarkus, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ITs (@QuarkusIntegrationTest) necesitan Docker/Dev Services; se omiten en CI
      - name: Build y pruebas unitarias
        working-directory: backend
        run: mvn -B -ntp verify -DskipITs

  frontend:
    name: Frontend (Angular, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Pruebas
        working-directory: frontend
        run: npm test -- --watch=false

  k8s-manifiestos:
    name: Validar manifiestos Kustomize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
      - name: Renderizar overlays y plataforma
        run: |
          set -e
          for d in infra/k8s/overlays/dev infra/k8s/overlays/prod infra/k8s/platform; do
            echo "== kustomize build $d =="
            kubectl kustomize "$d" > /dev/null
          done

  # El generador de migracion de datos (tools/db-migrator) NO se ejecuta en CI:
  # requiere el script SQL Server legado (script.sql), que no esta en el repo.
